[project]
name = "gridlock-sprint"
version = "1.0.0"
description = "Rush Hour contest sheets that carry their own puzzle"
requires-python = ">=3.12"

# Vercel installs from here, not from requirements.txt. The two lists must agree;
# levels.test.py checks that they do, because a deployment silently missing a
# dependency fails with a bare ModuleNotFoundError at request time.
dependencies = [
    "reportlab>=4.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "zxing-cpp>=2.2",
    "pg8000>=1.30",
]

[tool.vercel]
entrypoint = "app:app"
